stages:
  - build
  - test

variables:
  GIT_SSL_NO_VERIFY: "true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GIT_DEPTH: "0"

before_script:
  - export JAVA_HOME=/usr/lib/jvm/temurin-22-jdk-amd64
  - export PATH=$JAVA_HOME/bin:$PATH
  - chmod +x ./gradlew

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

build:
  stage: build
  script:
    - ./gradlew clean assemble
  tags:
    - miguel_test_runner
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

test_black_box:
  stage: test
  script:
    - ./gradlew test
  tags:
    - miguel_test_runner
  artifacts:
    paths:
      - build/test-results/test/TEST-*.xml

test_white_box:
  stage: test
  script:
    - ./gradlew jacocoTestReport
  tags:
    - miguel_test_runner
  artifacts:
    paths:
      - build/reports/jacoco*

after_script:
  - echo "End Automated Build"
