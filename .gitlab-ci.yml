stages:
  - build
  - test

variables:
  GIT_SSL_NO_VERIFY: "true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

before_script:
  - pkill -9 java || true
  - pkill -9 gradle || true
  - git config --global user.name "$CI_JOB_USERNAME"
  - git config --global user.email "8240332@estg.ipp.pt"
  - git remote set-url origin https://$CI_JOB_USERNAME:$CI_JOB_TOKEN@gitlab.estg.ipp.pt/8240332/esii-grupoi-2025-26.git
  - export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
  - export PATH=$JAVA_HOME/bin:$PATH
  - echo "Start Automated Build"
  - chmod +x ./gradlew

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

build:
  stage: build
  script:
    - ./gradlew clean assemble
  tags:
    - miguel_test_runner
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

test_black_box:
  stage: test
  script:
    - ./gradlew test
  tags:
    - miguel_test_runner
  artifacts:
    paths:
      - build/test-results/test/TEST-*.xml

test_white_box:
  stage: test
  script:
    - ./gradlew jacocoTestReport
  tags:
    - miguel_test_runner
  artifacts:
    paths:
      - build/reports/jacoco*

after_script:
  - echo "End Automated Build"
